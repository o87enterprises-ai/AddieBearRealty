<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adrianna Wigzell | eXp Realty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#fdfaf5;--ink:#161a22;--mut:#6a6358;--accent:#c9922e;--accent-ink:#2a1d05;--card:#fff;--line:#eadfce}
@media(prefers-color-scheme:dark){:root{--bg:#12100d;--ink:#f6efe3;--mut:#b3a994;--card:#1c1914;--line:#352f25;--accent:#e0a93f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.7 'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;position:fixed;inset:0 0 auto;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px)}
header b{font:400 20px 'Cormorant Garamond',Georgia,serif;letter-spacing:.28em;text-transform:uppercase}
.btn{background:var(--accent);color:var(--accent-ink,#2a1d05);padding:11px 26px;border-radius:2px;text-decoration:none;font:500 12px 'Jost',sans-serif;letter-spacing:.22em;text-transform:uppercase;display:inline-block;margin:6px 8px 6px 0}
.dx{position:relative;height:100vh;min-height:560px;overflow:hidden;background:radial-gradient(70% 60% at 50% 45%,#fff,var(--bg))}
#dx-stage{position:absolute;inset:0;width:100%;height:100%;display:none}.js3d #dx-stage{display:block}.js3d .dx-fallback{display:none}
.dx-fallback{position:absolute;inset:0;display:grid;place-content:center;gap:8px;padding-top:140px;font:400 13px 'Jost',sans-serif;letter-spacing:.12em}
.dx-fallback div{background:var(--accent);color:var(--accent-ink,#2a1d05);padding:10px 16px;border-radius:2px}
.dx-copy{position:absolute;left:0;right:0;top:12vh;text-align:center;padding:0 24px;pointer-events:none}
.eyebrow{font:500 12px 'Jost',sans-serif;letter-spacing:.38em;text-transform:uppercase;color:#9a6a12}
h1{font:700 clamp(44px,8vw,100px)/1 'Cormorant Garamond',Georgia,serif;letter-spacing:-.015em;margin:10px auto;max-width:960px;text-shadow:0 2px 18px rgba(253,250,245,.95),0 0 3px rgba(253,250,245,.9)}
h1 em{font-style:italic;font-weight:700;color:#b97d14}
.w{display:inline-block;white-space:nowrap;margin-right:.26em}.w:last-child{margin-right:0}
.ch{display:inline-block;opacity:0;transform:translateY(.55em);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*38ms)}
h1 em .ch{animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards,wave 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*38ms),calc(1.6s + var(--j)*140ms)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes wave{0%,100%{translate:0 0}50%{translate:0 -.06em}}
@media(prefers-reduced-motion:reduce){.ch{animation:none!important;opacity:1;transform:none}}
.dx-hud{position:absolute;left:24px;bottom:24px;font:400 11px 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
section.s{max-width:900px;margin:0 auto;padding:72px 24px}h2{font:300 44px/1.1 'Cormorant Garamond',Georgia,serif;margin:0 0 16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px 22px;letter-spacing:.04em}
footer{text-align:center;color:var(--mut);padding:40px 24px;font-size:12px;letter-spacing:.06em}
</style></head><body>
<header><b id="brand"></b><a class="btn" id="cta" href="#contact">Contact</a></header>
<section id="dx-pin" class="dx">
 <canvas id="dx-stage" aria-hidden="true"></canvas><div class="dx-fallback" id="fb" aria-hidden="true"></div>
 <div class="dx-copy"><p class="eyebrow" id="eyebrow">Inside the home</p><h1 id="h1"></h1></div>
 <div id="dx-hud" class="dx-hud" aria-live="polite" data-idle="Scroll to step inside">Scroll to step inside</div>
</section>
<section class="s" id="about"><h2>About</h2><div id="about-t"></div></section>
<section class="s" id="services"><h2>How I help</h2><div class="grid" id="svc"></div></section>
<section class="s" id="areas" hidden><h2>Areas served</h2><p id="areas-t"></p></section>
<section class="s" id="proof" hidden><h2>Kind words</h2><div class="grid" id="tst"></div></section>
<section class="s" id="contact"><h2>Let's talk</h2><p id="contact-t"></p></section>
<footer id="foot"></footer>
<script src="content.js"></script>
<script>
(function(){var S=window.SITE,$=function(i){return document.getElementById(i)},t=function(el,v){el.textContent=v};
function esc(v){return String(v)}
document.documentElement.style.setProperty('--accent',S.accent);
t($('brand'),S.name);document.title=S.name+' | '+S.brokerage;$('eyebrow').textContent=S.title+' · '+S.brokerage;
var h=$('h1'),words=S.tagline.split(' '),n=0,j=0;h.innerHTML='';h.setAttribute('aria-label',S.tagline);
words.forEach(function(wd,wi){var last=wi===words.length-1,box=last?document.createElement('em'):h;var ws=document.createElement('span');ws.className='w';ws.setAttribute('aria-hidden','true');
 wd.split('').forEach(function(ch){var l=document.createElement('span');l.className='ch';l.style.setProperty('--i',n++);if(last)l.style.setProperty('--j',j++);l.textContent=ch;ws.append(l)});
 if(last){box.append(ws);h.append(box)}else h.append(ws)});
var c=$('dx-stage'),f=[{name:'Upper floor',rooms:S.rooms.slice(4,8)},{name:'Main floor',rooms:S.rooms.slice(0,4)}];
c.setAttribute('data-floors',JSON.stringify(f));c.setAttribute('data-accent',S.blueprint||S.accent);
f.forEach(function(x){var d=document.createElement('div');d.textContent=x.name+': '+x.rooms.join(', ');$('fb').append(d)});
S.about.forEach(function(x){var p=document.createElement('p');p.textContent=x;$('about-t').append(p)});
S.services.forEach(function(s){var d=document.createElement('div');d.className='card';d.textContent=s;$('svc').append(d)});
if(S.areas.length){$('areas').hidden=false;t($('areas-t'),S.areas.join(' · '))}
S.testimonials=S.testimonials||[];if(S.testimonials.length){$('proof').hidden=false;S.testimonials.forEach(function(x){var d=document.createElement('div');d.className='card';d.textContent='“'+x.quote+'” — '+x.by;$('tst').append(d)})}
var ct=$('contact-t');if(S.officePhone){var o=document.createElement('p');o.textContent='Office: '+S.officePhone;ct.after(o)}var sr=document.createElement('a');sr.className='btn';sr.href=S.searchUrl;sr.textContent='Search homes';ct.after(sr);if(S.phone){var a=document.createElement('a');a.href='tel:'+S.phone.replace(/[^\d+]/g,'');a.textContent=S.phone;ct.append(a,' ')}
if(S.email){var m=document.createElement('a');m.href='mailto:'+S.email;m.textContent=S.email;ct.append(m)}

t($('foot'),S.name+' · '+S.title+' · '+S.brokerage+'. '+S.disclaimer+' Equal Housing Opportunity.');
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="house.js"></script>
</body></html>
